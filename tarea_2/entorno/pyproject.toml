# Entorno de los NOTEBOOKS de la tarea 2 (OCR, ASR, evaluación, LLM).
# Los grupos docai y audio están copiados del pyproject.toml del curso
# (github.com/d2cml-ai/Data-Science-Python), como pide el enunciado.
# La app de Streamlit NO usa este archivo: usa requirements.txt (liviano).
#   uv sync --group docai --group audio --group tarea2
[project]
name = "tarea-2-voces-documentos"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.8",
  "jupyterlab>=4",
  "ipykernel>=6.29",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "huggingface-hub>=1.29.0",
]

[dependency-groups]
docai = [
  "paddleocr[doc-parser]>=3.7",
  "openai-whisper",
  "pdf2image>=1.17",
  "pillow>=10",
  "pymupdf>=1.24",
  "faster-whisper>=1.2.1",
  "sounddevice>=0.5.6",
  "torchvision>=0.28.0",
  "pyannote-audio>=4.0.7",
  "tensorflow>=2.21.0",
  "paddlepaddle>=3.2.1",
  "transformers>=5.10",
]
audio = [
  "accelerate>=1.10",
  "faster-whisper>=1.2.1",
  "gradio>=6.0",
  "jiwer>=4.0",
  "librosa>=0.11",
  "mistral-common[audio]>=1.9",
  "pyannote-audio>=4.0.7",
  "sounddevice>=0.5.6",
  "soundfile>=0.13",
  "torch>=2.8",
  "transformers>=5.16",
]
# Lo que agrega la tarea 2 (no está en los grupos del curso)
tarea2 = [
  "rapidfuzz>=3.9",        # seudonimizar() de voz.py
  "pytesseract>=0.3.13",   # OCR alternativo (requiere el programa Tesseract)
  "google-genai>=2.29.0",  # LLM: Gemini API
  "python-dotenv>=1.0",
  "plotly>=5.24",
  "streamlit>=1.38",
  "nbconvert>=7",
  "kaleido>=1.5.0",
]

[tool.uv]
package = false
# Igual que en el curso: PaddleX fija opencv 4.10.0.84 y PyAV 19 rompe faster-whisper 1.2.1.
constraint-dependencies = ["opencv-python==4.10.0.84", "opencv-python-headless==4.10.0.84",
                           "opencv-contrib-python==4.10.0.84", "av<19"]
